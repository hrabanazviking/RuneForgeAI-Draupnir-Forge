# Slice 21 — truncation policy for the Context Compiler (data, not code).
#
# When a ContextPackage's token estimate exceeds max_tokens, the sections
# named in drop_order are emptied from the FRONT of the list first, one at
# a time, until the estimate fits or the order is exhausted. The task
# definition, interfaces, and invariants are never dropped — they are the
# non-negotiable core of the prompt.
#
# The compilation knobs below are data too: character budgets, keyword
# rules for decision matching, and binary/file guards.

max_tokens: 32000

drop_order:
  - prior_failures
  - decisions
  - domain_files
  - vision_excerpt

# Largest single file slice admitted into domain_files (bytes).
max_file_bytes: 51200

# Characters of SYSTEM_VISION.md kept as the vision excerpt.
vision_excerpt_chars: 4000

# Caps on matched sections.
max_decisions: 20
max_prior_failures: 20

# Decision keyword matching: words from the task title/goal of at least
# this length, excluding stopwords, are searched in DECISIONS.md.
min_keyword_len: 4

stopwords:
  - the
  - a
  - an
  - and
